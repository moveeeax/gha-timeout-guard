name: flaky
on:
  push:

concurrency:
  group: flaky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - run: pytest
      - name: upload coverage
        run: ./upload.sh
        continue-on-error: true
