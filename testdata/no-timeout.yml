name: build
on: [push]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: make package
