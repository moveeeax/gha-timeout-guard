name: ship
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - run: kubectl apply -f k8s/
